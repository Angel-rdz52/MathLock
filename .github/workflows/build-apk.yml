name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # BORRADO: android-actions/setup-android@v3
      # Ese paso era el que se trababa en "Fetch remote repository"
      # ubuntu-latest ya trae el Android SDK preinstalado, no lo necesitas

      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto Android (si no existe ya)
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Aplicar plugin de control parental
        run: bash scripts/setup-android.sh

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: MathLock-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
